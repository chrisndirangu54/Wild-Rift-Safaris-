name: CI
on:
  push:
  pull_request:
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install --no-audit --no-fund
      - run: npm run build
  functions:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - run: npm install --no-audit --no-fund
      - run: node --check index.js
      - run: node --check automation.js
      - run: node --check livingAfrica.js
      - run: node --check wildVision.js
      - run: node --check twinGraph.js
      - run: node --check graphIngestion.js
      - run: node --check graphConnectors.js
      - run: node --check connectorAutomation.js
      - run: node --check expedia.js
