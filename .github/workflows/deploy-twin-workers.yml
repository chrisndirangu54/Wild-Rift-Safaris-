name: Deploy Twin Workers
on:
  workflow_dispatch:
    inputs:
      project_id:
        description: Google Cloud project ID
        required: true
      region:
        description: Cloud Run region
        required: true
        default: europe-west1
permissions:
  contents: read
  id-token: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Deploy graph extractor
        run: |
          gcloud run deploy wild-ryftlands-graph-extractor --source services/extractor --project "${{ inputs.project_id }}" --region "${{ inputs.region }}" --platform managed --no-allow-unauthenticated --memory 512Mi --cpu 1 --max-instances 5
      - name: Deploy geospatial worker
        run: |
          gcloud run deploy wild-ryftlands-geospatial-worker --source services/geospatial --project "${{ inputs.project_id }}" --region "${{ inputs.region }}" --platform managed --no-allow-unauthenticated --memory 2Gi --cpu 2 --timeout 300 --max-instances 3
      - name: Show service URLs
        run: |
          gcloud run services describe wild-ryftlands-graph-extractor --project "${{ inputs.project_id }}" --region "${{ inputs.region }}" --format='value(status.url)'
          gcloud run services describe wild-ryftlands-geospatial-worker --project "${{ inputs.project_id }}" --region "${{ inputs.region }}" --format='value(status.url)'
